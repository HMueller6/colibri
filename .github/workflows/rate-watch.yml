# Refreshes the Rate Watch data and publishes the static site to the `rate-watch-site` branch.
# Point any static host (Netlify, Cloudflare Pages, Vercel, GitHub Pages "deploy from a branch") at that branch.
# Scheduled workflows only run from the default branch, so this needs to be merged there first.
name: rate-watch

on:
  schedule:
    - cron: '17 */6 * * 1-5'   # every 6 hours on weekdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-watch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test rate-watch/tests/unit.test.mjs
      - name: Fetch data (fails, and publishes nothing, if fewer than 80% of series load)
        run: node rate-watch/scripts/refresh.mjs --min-ok 0.8
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; the keyless FRED download is used when empty
      - name: Publish
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r rate-watch/index.html rate-watch/sw.js rate-watch/manifest.webmanifest rate-watch/css rate-watch/js rate-watch/data rate-watch/icons "$site"/
          cd "$site"
          git init -q -b rate-watch-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rate Watch site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rate-watch-site
